      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) },
        key, b64(D.ct));
      try { sessionStorage.setItem(KEY, pw); } catch (e) {}
      document.open(); document.write(new TextDecoder().decode(plain)); document.close();
      return true;
    } catch (e) {
      if (!quiet) err.textContent = 'That password did not work.';
      return false;
    }
  }

  // Carried between pages for this tab only, so following a link does not re-prompt.
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved, true);

  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = document.getElementById('go');
    b.disabled = true; b.textContent = 'Unlocking...'; err.textContent = '';
    unlock(document.getElementById('pw').value, false).then(function (ok) {
      if (!ok) { b.disabled = false; b.textContent = 'Unlock'; }
    });
  });
})();
</script>
</body></html>
