<script>
(function () {
  var D = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'board-pw';
  var err = document.getElementById('err');

  function b64(s) { var r = atob(s), a = new Uint8Array(r.length);
    for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }

  async function unlock(pw, quiet) {
    if (!window.crypto || !crypto.subtle) {
      err.textContent = 'This page needs https or localhost to decrypt.'; return false;
    }
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
        'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(D.salt), iterations: D.it, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) },
        key, b64(D.ct));
      try { sessionStorage.setItem(KEY, pw); } catch (e) {}
      document.open(); document.write(new TextDecoder().decode(plain)); document.close();
      return true;
    } catch (e) {
      if (!quiet) err.textContent = 'That password did not work.';
      return false;
    }
  }

  // Carried between pages for this tab only, so following a link does not re-prompt.
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved, true);

  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var b = document.getElementById('go');
    b.disabled = true; b.textContent = 'Unlocking...'; err.textContent = '';
    unlock(document.getElementById('pw').value, false).then(function (ok) {
      if (!ok) { b.disabled = false; b.textContent = 'Unlock'; }
    });
  });
})();
</script>
